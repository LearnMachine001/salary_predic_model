<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='signup.css') }}">
</head>
<body>

<div class="container">

    <div class="form-box">

        <h1>Create Account</h1>

        <form action="/signup" method="POST">

            <input type="text"
            placeholder="Full Name"
            name="name"
                required>

            <input type="email"
                name="email"
                placeholder="Email Address"
                required>

            <input type="password"
                name="password"
                placeholder="Password"
                required>

            <input type="password"
                name="confirm_password"
                placeholder="Confirm Password"
                required>

            <button type="submit">
                Sign Up
            </button>

        </form>

        <p>
            Already have an account?
            <a href="/login">Login</a>
        </p>

    </div>

</div>

</body>
</html>
