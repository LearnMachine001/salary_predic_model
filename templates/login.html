<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SalaryPredict AI</title>

    <link rel="stylesheet"
        href="{{ url_for('static', filename='login.css') }}">
</head>

<body>

    <div class="container">

        <div class="form-box">

            <h1>Welcome Back 👋</h1>

            <p class="subtitle">
                Login to continue your salary prediction journey
            </p>

            <form action="/login" method="POST">

                <div class="input-group">
                    <input type="email"
                        name="email"
                        placeholder="Email Address"
                        required>
                </div>

                <div class="input-group">
                    <input type="password"
                        name="password"
                        placeholder="Password"
                        required>
                </div>

                <button type="submit">
                    Login
                </button>

            </form>

            <p class="signup-link">
                Don't have an account?
                <a href="/signup">Create Account</a>
            </p>

        </div>

    </div>

</body>

</html>
